version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: derivaquant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: derivaquant
      POSTGRES_PASSWORD: derivaquant_secret_pw
      POSTGRES_DB: derivaquant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derivaquant -d derivaquant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
